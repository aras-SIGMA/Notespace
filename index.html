<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aplikasi pencatatan Notes App berbasis Web Component, RESTful API, dan Webpack"
    />
    <title>Notes App - Dashboard Pencatatan</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Web Component: Indikator Loading Global -->
    <loading-indicator loading="false"></loading-indicator>

    <div class="app-container">
      <!-- Web Component: Custom Sidebar Navigation -->
      <app-sidebar
        active-filter="all"
        count-all="0"
        count-active="0"
        count-archived="0"
      ></app-sidebar>

      <!-- Main Content Shell -->
      <div class="main-content">
        <!-- Web Component: Custom App Header & Search Bar -->
        <app-bar title="Notespace"></app-bar>

        <main class="content-body">
          <!-- Hero Section -->
          <section class="dashboard-hero">
            <div class="hero-text">
              <h1>Halo, Selamat Datang!</h1>
              <p>Kelola ide, rencana harian, dan catatan penting Anda dalam satu tempat.</p>
            </div>
            <div class="hero-actions">
              <button
                id="addNoteHeroBtn"
                type="button"
                class="btn-primary"
                aria-label="Tambah catatan baru"
              >
                <span>+ Tambah Catatan</span>
              </button>
            </div>
          </section>

          <!-- Stats Overview Cards -->
          <section class="stats-overview" aria-label="Statistik Catatan">
            <div class="stat-card">
              <div class="stat-info">
                <p>Total Catatan</p>
                <h2 id="statTotalNotes">0</h2>
              </div>
              <div class="stat-icon">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-info">
                <p>Catatan Aktif</p>
                <h2 id="statActiveNotes">0</h2>
              </div>
              <div class="stat-icon success">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-info">
                <p>Diarsipkan</p>
                <h2 id="statArchivedNotes">0</h2>
              </div>
              <div class="stat-icon warning">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="21 8 21 21 3 21 3 8"></polyline>
                  <rect x="1" y="3" width="22" height="5"></rect>
                  <line x1="10" y1="12" x2="14" y2="12"></line>
                </svg>
              </div>
            </div>
          </section>

          <!-- Web Component: Form Tambah Catatan dengan Realtime Validation -->
          <note-input max-length="50"></note-input>

          <!-- Notes Section -->
          <section class="notes-section" aria-label="Daftar Catatan">
            <div class="section-header">
              <h2 id="sectionTitle">Semua Catatan</h2>
              <span class="section-badge" id="sectionBadge">0 Total</span>
            </div>

            <!-- Web Component: Wadah Daftar Catatan Berbasis CSS Grid -->
            <note-list filter="all"></note-list>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
